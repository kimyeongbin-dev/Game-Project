# 게임모아 클라이언트 정적 분석 설정
include: package:flutter_lints/flutter.yaml

# Riverpod 전용 린트 (Dart analysis_server_plugin 방식 - custom_lint 불필요)
plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # 코드 생성 산출물 (drift / riverpod_generator)
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # 코드 생성 전 단계에서 part 파일 부재로 인한 분석 중단 방지
    uri_has_not_been_generated: warning

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print

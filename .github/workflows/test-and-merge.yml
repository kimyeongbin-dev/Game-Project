# ===================================================
# Test and Auto-Merge Workflow
# ===================================================
# Trigger: dev-test 브랜치에 push 시
# Action: 테스트 실행 후 성공 시 develop 브랜치로 자동 병합
#
# 서버 테스트는 docker compose 로 실행하여 로컬 개발 환경과 동일한
# 이미지/DB/Redis 구성을 사용한다.
#
# Flutter 테스트는 컨테이너 대신 subosito/flutter-action 을 사용한다.
# 이유: client 툴체인 이미지는 Android SDK 포함으로 수 GB 라서
#       매 CI 실행마다 pull 하면 수 분이 낭비된다.
#       컨테이너 경로(docker compose run client-test)는 로컬에서 CI를
#       재현할 때 쓰는 용도로 유지한다.
# ===================================================

name: Test and Auto-Merge to Develop

on:
  push:
    branches:
      - dev-test

concurrency:
  group: test-and-merge-${{ github.ref }}
  cancel-in-progress: true

# Flutter 버전은 여기에 적지 않는다. 저장소 루트 `.flutter-version` 이 단일 기준이며
# version-guard 잡이 Dockerfile 기본값과의 불일치를 빌드 실패로 잡는다.

jobs:
  # ===================================================
  # Job 0: Version Guard — 버전 드리프트를 가장 먼저 차단
  # ===================================================
  version-guard:
    name: Version Guard (.flutter-version)
    runs-on: ubuntu-latest
    outputs:
      flutter-version: ${{ steps.fv.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Read .flutter-version
        id: fv
        run: |
          V="$(tr -d '[:space:]' < .flutter-version)"
          if [ -z "$V" ]; then echo "::error::.flutter-version 이 비어 있습니다"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Flutter 기준 버전: $V"

      - name: Check .flutter-version 과 Dockerfile 일치
        # 러너에 아직 flutter 가 없으므로 로컬 SDK 검사는 경고로만
        run: bash scripts/check-flutter-version.sh --warn

      - name: Guard — 폐기된 레거시 경로 부활 차단
        # backend_fastapi/ frontend_flutter/ games/ 가 되살아나면 머지 사고다.
        # origin/develop 계열을 잘못 머지했을 때 잡힌다.
        run: bash scripts/check-legacy-paths.sh

      - name: Guard — 버전 고정 규율
        # 직접 의존성 == / uv.lock / 이미지 다이제스트 / pubspec 정확 버전 /
        # Actions 커밋 SHA / Android SDK 명시 고정을 검사한다.
        run: bash scripts/check-version-pinning.sh

      - name: Guard — 프록시 신뢰 경계·토큰 로그
        # Caddyfile 접속 로그 금지, server 호스트 포트 없음, XFF 신뢰 = proxy 주소, '--forwarded-allow-ips *' 금지 (M4-1)
        run: bash scripts/check-proxy-config.sh

  # ===================================================
  # Job 1: Server Tests (FastAPI + 게임 엔진 + PostgreSQL + Redis)
  # ===================================================
  server-tests:
    name: Server Tests (pytest in Docker)
    needs: version-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # docker-compose.yml 은 REDIS_PASSWORD 기본값이 없다(:? 필수). 실행마다 무작위로 만든다
      - name: Generate Redis password
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "REDIS_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Build test image
        run: docker compose build server-test

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait db redis

      - name: Run pytest
        run: |
          set -o pipefail
          docker compose run --rm -T server-test \
            pytest -v --tb=long --junitxml=test-results.xml 2>&1 | tee pytest-output.log

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: server-test-results
          path: |
            server/test-results.xml
            pytest-output.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ===================================================
  # Job 1b: Proxy E2E (Caddy → uvicorn, M4-1) — 로컬과 같은 명령
  # ===================================================
  proxy-e2e:
    name: Proxy E2E (Caddy in Docker)
    needs: version-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Generate Redis password
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "REDIS_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Start stack behind the proxy
        run: docker compose up -d --build --wait proxy

      - name: Build test image
        run: docker compose build server-test

      - name: Run proxy E2E
        run: docker compose run --rm -T -e E2E_BASE_URL=http://proxy:8080 server-test pytest e2e -v --tb=long

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ===================================================
  # Job 2: Client Tests (Flutter analyze + test)
  # ===================================================
  client-tests:
    name: Client Tests (Flutter)
    needs: version-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          # flutter-action 은 Google 공식 릴리스 아카이브에서 받으므로
          # client/Dockerfile 이 설치하는 바이너리와 동일하다.
          flutter-version: ${{ needs.version-guard.outputs.flutter-version }}
          channel: stable
          cache: true

      - name: Verify runner Flutter matches .flutter-version
        run: bash scripts/check-flutter-version.sh

      - name: Get dependencies
        working-directory: client
        run: flutter pub get

      - name: Verify formatting
        working-directory: client
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Run tests
        working-directory: client
        run: flutter test --reporter=expanded --machine > test-results.json

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: client-test-results
          path: client/test-results.json
          retention-days: 7

  # ===================================================
  # Job 3: Auto-Merge to Develop (모든 테스트 통과 후)
  # ===================================================
  auto-merge:
    name: Auto-Merge to Develop
    runs-on: ubuntu-latest
    needs: [version-guard, server-tests, proxy-e2e, client-tests]
    if: success()

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to develop
        run: |
          git fetch origin develop
          git checkout develop
          git merge origin/dev-test --no-ff -m "Auto-merge: dev-test -> develop (Tests passed)

          Automated merge after successful tests.

          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Commit: ${{ github.sha }}"
          git push origin develop

      - name: Merge success notification
        run: |
          echo "✅ Successfully merged dev-test into develop"
          echo "📋 Commit: ${{ github.sha }}"
          echo "🔗 Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

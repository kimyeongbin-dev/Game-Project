# =============================================================================
# M3 7단계 C — 실제 uvicorn 워커 2개 + 실제 Redis·PostgreSQL 완료 판정 하네스
#
#   export HARNESS_REDIS_PASSWORD=$(python -c "import secrets;print(secrets.token_hex(16))")
#   docker compose -p m3s7 -f server/harness/multiworker/compose.yml up -d --build server
#   docker compose -p m3s7 -f server/harness/multiworker/compose.yml run --rm client python scenarios.py all --runs 3
#   docker compose -p m3s7 -f server/harness/multiworker/compose.yml down -v
#
# 서버는 server/Dockerfile 의 **prod 타깃 그대로**(이미지에 소스 포함) + --workers 2. 플래그는 prod CMD 와 같고 워커만 다르다.
# 짧은 시계(초기 30 s·증분 2 s, 접속 30 s)로 만료를 빨리 본다 — 규칙이 아니라 숫자만 바꾼다(운영 조정 항목).
# 포트를 호스트에 열지 않는다(Redis 침입 이력, CLAUDE.md). client 만 같은 네트워크에서 접속한다.
# client 는 Docker 엔진 소켓으로 워커 kill·Redis pause·서버 stop 을 한다 — 로컬 하네스 전용이다.
# =============================================================================
name: m3s7

services:
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1",
              "--requirepass", "${HARNESS_REDIS_PASSWORD:?set HARNESS_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${HARNESS_REDIS_PASSWORD:?set HARNESS_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    cpus: 0.5

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: gamemoa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: harness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamemoa"]
      interval: 2s
      timeout: 2s
      retries: 15
    cpus: 0.5

  server:
    build:
      context: ../..
      target: prod
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "2",
              "--ws-ping-interval", "5", "--ws-ping-timeout", "5", "--ws-max-size", "4096",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://postgres:harness@db:5432/gamemoa
      DB_ENABLED: "true"
      REDIS_URL: redis://:${HARNESS_REDIS_PASSWORD:?set HARNESS_REDIS_PASSWORD}@redis:6379/0
      REDIS_LIMITER_DB: "2"
      PUBSUB_NAMESPACE: app
      JWT_SECRET_KEY: harness-only-jwt-secret-0123456789abcdef
      WS_EXPOSE_WORKER: "true"
      CLOCK_INITIAL_MS: "30000"
      CLOCK_INCREMENT_MS: "2000"
      CONNECTION_BUDGET_MS: "30000"
      RATE_LIMIT_ENABLED: "false"
    depends_on:
      redis: {condition: service_healthy}
      db: {condition: service_healthy}
    cpus: 2

  client:
    profiles: [client]
    build:
      context: ../..
      target: deps
    working_dir: /srv/harness
    environment:
      REDIS_URL: redis://:${HARNESS_REDIS_PASSWORD:?set HARNESS_REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql://postgres:harness@db:5432/gamemoa
      JWT_SECRET_KEY: harness-only-jwt-secret-0123456789abcdef
      SERVER_WS: ws://server:8000/api/v1/ws/maze
      SERVER_HTTP: http://server:8000
      COMPOSE_PROJECT: m3s7
      HARNESS_FALSIFY: ${HARNESS_FALSIFY:-}
    volumes:
      - .:/srv/harness
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: 1
